<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>综合查询 · 校园公共信息与数据展示中心</title>
  <meta name="description" content="在运动场馆、食堂、自习室之间切换，按名称搜索并按类型、拥挤状态、楼层、开放状态筛选">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>

  <div id="cdn-fail" class="alert alert-danger alert-ribbon d-none" role="alert">
    <i class="bi bi-wifi-off me-1"></i>CDN 资源加载失败（可能处于断网状态），请检查网络后刷新页面。
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark brand-nav sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-mortarboard-fill me-1"></i>校园公共信息与数据展示中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="query.html">综合查询</a></li>
          <li class="nav-item"><a class="nav-link" href="stats.html">数据中心</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">三维校园</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="section">
    <div class="container">
      <h2 class="section-title">综合查询</h2>
      <p class="section-sub mb-4">先选择服务类型，再输入名称关键词或设置筛选条件，结果即时更新。</p>

      <ul class="nav nav-pills cat-tabs" id="catTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" data-cat="sports" type="button" role="tab" aria-selected="true">
            <i class="bi bi-trophy-fill"></i>运动场馆
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-cat="canteen" type="button" role="tab" aria-selected="false">
            <i class="bi bi-cup-hot-fill"></i>食堂餐饮
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-cat="rooms" type="button" role="tab" aria-selected="false">
            <i class="bi bi-book"></i>自习空间
          </button>
        </li>
      </ul>

      <div class="row g-4 pt-4">
        <!-- 筛选条件 -->
        <div class="col-lg-3">
          <div class="card filter-card">
            <div class="card-body">
              <h6 class="filter-title"><i class="bi bi-funnel me-1"></i>查询条件</h6>

              <label for="q-name" class="form-label">名称关键词</label>
              <div class="input-group input-group-sm mb-3">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input id="q-name" type="search" class="form-control" placeholder="如：篮球、品味、图书馆">
              </div>

              <!-- 运动场馆条件 -->
              <div class="filter-group active" data-group="sports">
                <label for="q-type" class="form-label">场馆类型</label>
                <select id="q-type" class="form-select form-select-sm mb-3">
                  <option value="all" selected>全部类型</option>
                  <option value="室内">室内</option>
                  <option value="室外">室外</option>
                </select>

                <label for="q-level" class="form-label">拥挤状态</label>
                <select id="q-level" class="form-select form-select-sm mb-3">
                  <option value="all" selected>全部状态</option>
                  <option value="ok">空闲</option>
                  <option value="warn">适中</option>
                  <option value="busy">拥挤</option>
                </select>
              </div>

              <!-- 食堂条件 -->
              <div class="filter-group" data-group="canteen">
                <label for="q-clevel" class="form-label">拥挤状态</label>
                <select id="q-clevel" class="form-select form-select-sm mb-3">
                  <option value="all" selected>全部状态</option>
                  <option value="ok">空闲</option>
                  <option value="warn">适中</option>
                  <option value="busy">拥挤</option>
                </select>
              </div>

              <!-- 自习室条件 -->
              <div class="filter-group" data-group="rooms">
                <label for="q-floor" class="form-label">所在楼层</label>
                <select id="q-floor" class="form-select form-select-sm mb-3">
                  <option value="all" selected>全部楼层</option>
                </select>

                <label for="q-status" class="form-label">开放状态</label>
                <select id="q-status" class="form-select form-select-sm mb-3">
                  <option value="all" selected>全部状态</option>
                  <option value="open">开放中</option>
                  <option value="closed">已关闭</option>
                </select>
              </div>

              <button id="q-reset" type="button" class="btn btn-sm btn-outline-secondary w-100">
                <i class="bi bi-arrow-counterclockwise me-1"></i>重置条件
              </button>
            </div>
          </div>
        </div>

        <!-- 查询结果 -->
        <div class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">查询结果</h5>
            <span id="result-count" class="badge rounded-pill text-bg-primary">共 0 项</span>
          </div>
          <div id="result-list" class="row g-3"></div>
          <div id="result-empty" class="placeholder-block d-none">
            <i class="bi bi-search-heart"></i>
            <p class="mb-0">没有符合条件的结果，请放宽关键词或筛选条件。</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><span class="mb-0"><small>校园公共信息与数据展示中心 · 综合查询</small></span></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/query.js"></script>
  <script>
    window.addEventListener('load', function () {
      if (!window.jQuery || !window.bootstrap || !window.CampusData) {
        document.getElementById('cdn-fail').classList.remove('d-none');
      }
    });
  </script>
</body>

</html>
