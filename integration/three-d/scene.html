<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园三维导览 · 校园信息中心</title>

  <!-- 第三方库 CSS（版本锁定） -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- 子页引用上级公共样式 -->
  <link href="../css/style.css" rel="stylesheet">
</head>

<body class="simple-page">

  <!-- 断网 / CDN 加载失败提示 -->
  <div id="cdn-fail" class="alert alert-danger alert-ribbon d-none" role="alert">
    <i class="bi bi-wifi-off me-1"></i>CDN 资源加载失败（可能处于断网状态），请检查网络后刷新页面。
  </div>

  <!-- 与首页一致的统一导航，当前项为“校园三维” -->
  <nav class="navbar navbar-expand-lg navbar-dark brand-nav sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html#home">
        <i class="bi bi-mortarboard-fill me-1"></i>校园信息中心
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../index.html#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="../index.html#rooms">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="../index.html#stats">统计</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 第一次提交：三维场景占位；第三次提交接入 Three.js -->
  <main class="simple-main">
    <div class="container">
      <div class="placeholder-block">
        <i class="bi bi-box-seam"></i>
        <h4 class="mb-2">校园三维导览建设中</h4>
        <p class="mb-3">Three.js 校园地标场景将在第三次提交接入，可从统一导航进入并返回首页。</p>
        <a class="btn btn-primary" href="../index.html#home">
          <i class="bi bi-arrow-left me-1"></i>返回首页
        </a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <span class="mb-0"><small>校园公共信息与数据展示中心（课堂综合案例）· 三维导览</small></span>
    </div>
  </footer>

  <!-- 库在前，自己的代码在后 -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.addEventListener('load', function () {
      if (!window.jQuery || !window.bootstrap) {
        document.getElementById('cdn-fail').classList.remove('d-none');
      }
    });
  </script>
</body>

</html>
