<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园三维导览 · 校园信息中心</title>

  <!-- 第三方库 CSS（版本锁定，三维库以 ES Module + importmap 方式在页底引入） -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- 子页引用上级公共样式 -->
  <link href="../css/style.css" rel="stylesheet">
</head>

<body class="scene-page">

  <!-- 断网 / CDN 加载失败提示 -->
  <div id="cdn-fail" class="alert alert-danger alert-ribbon d-none" role="alert">
    <i class="bi bi-wifi-off me-1"></i>CDN 三维资源加载失败（可能处于断网状态），请检查网络后刷新页面。
  </div>

  <!-- 与首页一致的统一导航，当前项为“校园三维” -->
  <nav class="navbar navbar-expand-lg navbar-dark brand-nav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html#home">
        <i class="bi bi-mortarboard-fill me-1"></i>校园信息中心
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../index.html#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="../index.html#rooms">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="../index.html#stats">统计</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 三维场景容器（独立子页，不塞进主页面，避免拖慢首页加载） -->
  <main class="scene-wrap">
    <div id="three-container"></div>

    <!-- 悬浮操作层 -->
    <div class="scene-hud">
      <div class="hud-card">
        <h6 class="mb-1"><i class="bi bi-geo-alt-fill me-1"></i>校园三维导览</h6>
        <p class="mb-0">左键旋转 · 滚轮缩放 · 右键平移</p>
      </div>
      <div class="hud-actions">
        <button id="btn-rotate" class="btn btn-light btn-sm" type="button" aria-pressed="false">
          <i class="bi bi-arrow-repeat me-1"></i>自动环绕
        </button>
        <button id="btn-reset" class="btn btn-light btn-sm" type="button">
          <i class="bi bi-camera me-1"></i>复位视角
        </button>
        <a class="btn btn-light btn-sm" href="../index.html#home">
          <i class="bi bi-house me-1"></i>返回首页
        </a>
      </div>
    </div>

    <!-- 加载 / 失败占位 -->
    <div id="scene-loading" class="scene-loading">
      <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
      <span id="scene-loading-text">三维场景加载中…</span>
    </div>
  </main>

  <!-- 经典脚本：jQuery 与 Bootstrap 仅服务导航（版本锁定） -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Three.js 0.160.0：ES Module + importmap，版本锁定 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ---------- 基础渲染环境 ---------- */
    const container = document.getElementById('three-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcfe8ff);
    scene.fog = new THREE.Fog(0xcfe8ff, 60, 115);

    const camera = new THREE.PerspectiveCamera(
      55, container.clientWidth / container.clientHeight, 0.1, 300
    );
    const HOME_POSITION = new THREE.Vector3(24, 19, 26);
    const HOME_TARGET = new THREE.Vector3(0, 2, 0);
    camera.position.copy(HOME_POSITION);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(HOME_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 10;
    controls.maxDistance = 70;
    controls.maxPolarAngle = Math.PI * 0.49; // 不允许钻到地面以下
    controls.autoRotateSpeed = 1.2;
    controls.update();

    /* ---------- 灯光 ---------- */
    scene.add(new THREE.HemisphereLight(0xd6ecff, 0x8a9a6b, 0.95));

    const sun = new THREE.DirectionalLight(0xfff3d6, 2.1);
    sun.position.set(20, 30, 14);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -45;
    sun.shadow.camera.right = 45;
    sun.shadow.camera.top = 45;
    sun.shadow.camera.bottom = -45;
    sun.shadow.camera.far = 90;
    sun.shadow.bias = -0.0004;
    scene.add(sun);

    /* ---------- 地面、道路与中心广场 ---------- */
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 120),
      new THREE.MeshStandardMaterial({ color: 0xa7c97e, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x9aa3ab, roughness: 0.95 });
    const roadX = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.08, 80), roadMat);
    roadX.position.y = 0.03;
    const roadZ = new THREE.Mesh(new THREE.BoxGeometry(80, 0.08, 2.6), roadMat);
    roadZ.position.y = 0.03;
    scene.add(roadX, roadZ);

    const plaza = new THREE.Mesh(
      new THREE.CircleGeometry(7, 48),
      new THREE.MeshStandardMaterial({ color: 0xd8d2c4, roughness: 1 })
    );
    plaza.rotation.x = -Math.PI / 2;
    plaza.position.y = 0.06;
    plaza.receiveShadow = true;
    scene.add(plaza);

    /* ---------- 地标建筑：程序化立面贴图（楼层窗户） ---------- */
    function facadeTexture(baseColor, floors, cols) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, 256, 256);

      const padX = 20;
      const padY = 26;
      const cellW = (256 - padX * 2) / cols;
      const cellH = (256 - padY * 2) / floors;

      for (let f = 0; f < floors; f++) {
        for (let c = 0; c < cols; c++) {
          // 固定伪随机，保证每次渲染一致
          const lit = ((f * 7 + c * 13) % 5) < 2;
          ctx.fillStyle = lit ? 'rgba(255, 236, 170, .95)' : 'rgba(40, 60, 80, .5)';
          const x = padX + c * cellW + cellW * 0.22;
          const y = padY + f * cellH + cellH * 0.22;
          ctx.fillRect(x, y, cellW * 0.56, cellH * 0.52);
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    /* ---------- 建筑名称标牌（Canvas 精灵） ---------- */
    function makeLabel(text) {
      const fontSize = 34;
      const padX = 18;
      const padY = 10;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.font = 'bold ' + fontSize + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
      const textWidth = ctx.measureText(text).width;

      canvas.width = Math.ceil(textWidth + padX * 2);
      canvas.height = fontSize + padY * 2;

      const ctx2 = canvas.getContext('2d');
      const radius = 12;
      const w = canvas.width;
      const h = canvas.height;
      ctx2.beginPath();
      ctx2.moveTo(radius, 0);
      ctx2.arcTo(w, 0, w, h, radius);
      ctx2.arcTo(w, h, 0, h, radius);
      ctx2.arcTo(0, h, 0, 0, radius);
      ctx2.arcTo(0, 0, w, 0, radius);
      ctx2.closePath();
      ctx2.fillStyle = 'rgba(13, 71, 113, .88)';
      ctx2.fill();

      ctx2.font = 'bold ' + fontSize + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx2.fillStyle = '#ffffff';
      ctx2.textBaseline = 'middle';
      ctx2.textAlign = 'center';
      ctx2.fillText(text, w / 2, h / 2 + 1);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthWrite: false
      }));
      sprite.scale.set(w / 44, h / 44, 1);
      return sprite;
    }

    const landmarks = [
      { name: '图书馆', x: -16, z: -18, w: 10, h: 9, d: 7, color: '#7fa8c9', floors: 5, cols: 6 },
      { name: '第一教学楼', x: 15, z: -17, w: 9, h: 7, d: 7, color: '#d9a441', floors: 4, cols: 5 },
      { name: '第二教学楼', x: -16, z: 13, w: 9, h: 8, d: 7, color: '#8fb573', floors: 4, cols: 5 },
      { name: '体育馆', x: 16, z: 14, w: 11, h: 5, d: 8, color: '#5fa8a0', floors: 2, cols: 6 },
      { name: '自习中心', x: -29, z: -1, w: 7, h: 6, d: 7, color: '#6c8ebf', floors: 3, cols: 4 },
      { name: '学生食堂', x: 28, z: -1, w: 8, h: 4.5, d: 7, color: '#e0a458', floors: 2, cols: 5 }
    ];

    const roofMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.9 });

    landmarks.forEach(function (b) {
      const group = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(b.w, b.h, b.d),
        new THREE.MeshStandardMaterial({
          map: facadeTexture(b.color, b.floors, b.cols),
          roughness: 0.85
        })
      );
      body.position.y = b.h / 2;
      body.castShadow = true;
      body.receiveShadow = true;

      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(b.w + 0.5, 0.5, b.d + 0.5),
        roofMat
      );
      roof.position.y = b.h + 0.25;
      roof.castShadow = true;

      const label = makeLabel(b.name);
      label.position.y = b.h + 1.6;

      group.add(body, roof, label);
      group.position.set(b.x, 0, b.z);
      scene.add(group);
    });

    /* ---------- 绿化：固定位置的低多边形树 ---------- */
    const trunkGeo = new THREE.CylinderGeometry(0.18, 0.24, 1.4, 8);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a5a33, roughness: 1 });
    const canopyGeo = new THREE.IcosahedronGeometry(1.35, 0);
    const canopyMat = new THREE.MeshStandardMaterial({ color: 0x4f8a3d, roughness: 1, flatShading: true });

    const treeSpots = [
      [-10.8, -6.2], [-6.2, -10.8], [6.2, -10.8], [10.8, -6.2],
      [-10.8, 6.2], [-6.2, 10.8], [6.2, 10.8], [10.8, 6.2],
      [-8, -8], [8, -8], [-8, 8], [8, 8]
    ];

    treeSpots.forEach(function (spot, i) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 0.7;
      trunk.castShadow = true;
      const canopy = new THREE.Mesh(canopyGeo, canopyMat);
      canopy.position.y = 2;
      canopy.castShadow = true;
      tree.add(trunk, canopy);
      tree.position.set(spot[0], 0, spot[1]);
      tree.rotation.y = i * 0.6; // 树冠朝向错开，避免雷同
      scene.add(tree);
    });

    /* ---------- 旗杆 ---------- */
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 5, 12),
      new THREE.MeshStandardMaterial({ color: 0xcfd6dd, metalness: 0.6, roughness: 0.4 })
    );
    pole.position.set(0, 2.5, 9.5);
    pole.castShadow = true;
    const flag = new THREE.Mesh(
      new THREE.PlaneGeometry(1.6, 1),
      new THREE.MeshStandardMaterial({ color: 0xd93633, side: THREE.DoubleSide, roughness: 0.8 })
    );
    flag.position.set(0.85, 4.2, 9.5);
    scene.add(pole, flag);

    /* ---------- 交互按钮：自动环绕 / 复位视角 ---------- */
    const rotateBtn = document.getElementById('btn-rotate');
    rotateBtn.addEventListener('click', function () {
      controls.autoRotate = !controls.autoRotate;
      rotateBtn.classList.toggle('active', controls.autoRotate);
      rotateBtn.setAttribute('aria-pressed', String(controls.autoRotate));
    });

    document.getElementById('btn-reset').addEventListener('click', function () {
      controls.autoRotate = false;
      rotateBtn.classList.remove('active');
      rotateBtn.setAttribute('aria-pressed', 'false');
      camera.position.copy(HOME_POSITION);
      controls.target.copy(HOME_TARGET);
      controls.update();
    });

    /* ---------- 自适应尺寸 ---------- */
    new ResizeObserver(function () {
      const width = container.clientWidth;
      const height = container.clientHeight;
      if (width === 0 || height === 0) {
        return;
      }
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }).observe(container);

    /* ---------- 渲染循环 ---------- */
    let firstFrame = true;
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);

      if (firstFrame) {
        firstFrame = false;
        document.getElementById('scene-loading').classList.add('d-none');
        window.__threeReady = true;
      }
    }
    animate();
  </script>

  <!-- 三维资源加载失败兜底（断网或 CDN 不可达） -->
  <script>
    (function () {
      var banner = document.getElementById('cdn-fail');
      var loading = document.getElementById('scene-loading');
      var loadingText = document.getElementById('scene-loading-text');

      function showFail() {
        banner.classList.remove('d-none');
        if (loadingText) {
          loadingText.textContent = '三维资源加载失败，请检查网络后刷新页面。';
        }
      }

      // 捕获 CDN 的 link / script 网络错误
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          showFail();
        }
      }, true);

      // 模块脚本被浏览器跨域拦截时不会冒泡元素错误，用超时兜底
      setTimeout(function () {
        if (!window.__threeReady) {
          showFail();
        }
      }, 8000);
    })();
  </script>
</body>

</html>
